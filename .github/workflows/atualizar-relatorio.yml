name: Atualizar relatório IPCA

on:
  schedule:
    # Todo dia 8 a 15, 12:00 UTC (09:00 BRT).
    #
    # A data de divulgação do IPCA varia de mês para mês — em novembro/2026,
    # por exemplo, o IBGE divulgou no dia 12. Um cron em dia fixo erra sempre
    # que a divulgação cai depois dele, e o relatório fica um mês defasado até
    # a rodada seguinte. Em vez de apostar num dia, a rotina verifica todos os
    # dias da janela se a série já avançou e só então renderiza.
    - cron: "0 12 8-15 * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Renderizar mesmo sem mês novo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-relatorio
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Consulta barata (sem R, sem Quarto) só para descobrir se há mês novo.
      # Evita montar todo o ambiente nos dias em que não houve divulgação.
      - name: Verificar se há mês de referência novo
        id: ref
        run: |
          set -euo pipefail

          resposta=$(curl -sS --fail --retry 3 --retry-delay 10 \
            "https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados/ultimos/1?formato=json")

          # A API devolve a data como "01/10/2026" (dd/mm/aaaa)
          atual=$(echo "$resposta" | jq -r '.[0].data' | awk -F/ '{print $3"-"$2}')

          if [ ! -f referencia_ipca.txt ]; then
            anterior="(nenhuma)"
          else
            anterior=$(cat referencia_ipca.txt)
          fi

          echo "Mês de referência publicado: $atual"
          echo "Mês de referência no repositório: $anterior"

          if [ "$atual" != "$anterior" ] || [ "${{ inputs.forcar }}" = "true" ]; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Sem mês novo — nada a fazer."
          fi

          echo "atual=$atual" >> "$GITHUB_OUTPUT"

      - name: Configurar R
        if: steps.ref.outputs.mudou == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configurar Quarto
        if: steps.ref.outputs.mudou == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar pacotes R
        if: steps.ref.outputs.mudou == 'true'
        run: |
          Rscript -e 'install.packages(c("rbcb","sidrar","dplyr","tidyr","lubridate","slider","ggplot2","scales","knitr","rmarkdown","httr","tibble"))'

      - name: Renderizar relatório com dados atualizados
        if: steps.ref.outputs.mudou == 'true'
        run: quarto render relatorio_ipca.qmd --cache-refresh

      - name: Commitar e enviar relatório atualizado
        if: steps.ref.outputs.mudou == 'true'
        run: |
          set -euo pipefail

          echo "${{ steps.ref.outputs.atual }}" > referencia_ipca.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ referencia_ipca.txt

          if git diff --staged --quiet; then
            echo "Render não alterou nenhum arquivo — nada para commitar."
          else
            # A mensagem usa o mês de REFERÊNCIA do dado, não o da execução:
            # o IPCA de outubro é divulgado em novembro, e datar o commit pelo
            # mês da rodada torna o histórico ilegível.
            git commit -m "chore: atualiza relatório IPCA com dados de ${{ steps.ref.outputs.atual }}"
            git push
          fi
