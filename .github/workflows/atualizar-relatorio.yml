name: Atualizar relatório IPCA

on:
  schedule:
    # Dia 11 de cada mês, 12:00 UTC — após a divulgação mensal do IPCA pelo IBGE
    - cron: "0 12 11 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Instalar pacotes R
        run: |
          Rscript -e 'install.packages(c("rbcb","sidrar","dplyr","tidyr","lubridate","slider","ggplot2","scales","knitr"))'

      - name: Renderizar relatório com dados atualizados
        run: quarto render relatorio_ipca.qmd --cache-refresh

      - name: Commitar e enviar relatório atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Sem alterações nos dados — nada para commitar."
          else
            git commit -m "chore: atualiza relatório IPCA com dados de $(date +%Y-%m)"
            git push
          fi
